# Lint, build, test, and publish downloadable ovecc binaries.
#
# - `lint` runs `cargo xtask lint` (fmt + clippy `-D warnings`), the strict
#   dependency audit, and the suppression report; failures gate everything.
# - `build-test` runs on every push to `mvp` or `main` and every PR, on Linux,
#   Windows and macOS, compiling and testing in release mode. The heavy
#   dependencies (DuckDB's bundled C++ build, oxc, tree-sitter) are cached by
#   Swatinem/rust-cache, so only the first run per OS pays the full ~15-20 min
#   (longer on the 3-CPU macOS runner); later runs are minutes.
# - `release` runs only on push to `main` (or manual dispatch from main). It
#   recreates a rolling "latest" pre-release with every binary attached, so
#   the newest dev build for each platform is always downloadable.
# - `release-version` runs on `v*` tags. It checks the tag against the
#   workspace version, takes that version's CHANGELOG section as the notes,
#   and publishes the versioned release — the one `/releases/latest` serves.
#   Cutting a release is: bump the version in Cargo.toml, move the Unreleased
#   changelog entries under the new heading, tag `vX.Y.Z`, push the tag.
# - `publish-npm` runs after it and ships the same binaries to npm: one platform
#   package per target, whose `os`/`cpu` fields make npm download only the
#   matching one, plus the `ovecc` launcher. No install script, so `npx ovecc`
#   works under `--ignore-scripts`. Needs the `NPM_TOKEN` secret.
#
# Windows uses the GNU (MinGW-w64) toolchain — the supported path per
# docs/dev/SETUP.md. We install the gnu host toolchain and MSYS2's gcc so
# .cargo/config.toml (big-obj assembly + static MinGW/rstrtmgr linking) applies
# and produces the same self-contained ovecc.exe as a local build. MSVC is NOT
# used: it would require patching crates/ovecc-db/build.rs and pinning VS 14.41.
name: CI

on:
  push:
    branches: [mvp, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Default to read-only; the release job opts into write for creating releases.
permissions:
  contents: read

# Supersede in-flight runs on the same ref so pushes don't race on the release.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint, audit, suppressions (cargo xtask)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (+ rustfmt, clippy)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2.85.4
        with:
          tool: cargo-audit

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2
        with:
          key: lint

      - name: Lint
        run: cargo xtask lint

      - name: Dependency audit
        run: cargo xtask audit --strict

      - name: Suppression report
        run: cargo xtask suppressions

  build-test:
    name: Build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Raised from 45: GitHub evicts a cache after ~7 idle days, and a cold
    # release build of DuckDB's bundled C++ (plus oxc / tree-sitter) on the
    # Windows GNU runner overran the old limit. 120 lets a cold run finish and
    # rewarm the cache; lower it again once warm runs are consistently fast.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            toolchain: stable
            asset: ovecc-linux-x86_64
            ext: ""
          - os: windows-latest
            toolchain: stable-x86_64-pc-windows-gnu
            asset: ovecc-windows-x86_64.exe
            ext: ".exe"
          # Pinned rather than macos-latest: that label moved to macOS 15 in
          # August 2025 and will move again, silently raising the minimum macOS
          # the published binary runs on. Standard arm64 runner, so it stays
          # free on a public repo.
          - os: macos-15
            toolchain: stable
            asset: ovecc-macos-aarch64
            ext: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust (${{ matrix.toolchain }})
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      # Windows: DuckDB + ring compile from C/C++, so we need a real MinGW gcc.
      # rustup's gnu toolchain only ships link libs, not a compiler.
      - name: Set up MinGW-w64 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - name: Put MinGW-w64 first on PATH (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: echo "${{ steps.msys2.outputs.msys2-location }}/mingw64/bin" >> "$GITHUB_PATH"

      - name: Cache cargo registry + target
        uses: Swatinem/rust-cache@v2

      - name: Build (release)
        run: cargo build --release --bin ovecc

      - name: Test (release)
        run: cargo xtask test --release

      - name: Package binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/release/ovecc${{ matrix.ext }}" "dist/${{ matrix.asset }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  self-review:
    name: Self review (ovecc on ovecc)
    needs: build-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download the Linux binary
        uses: actions/download-artifact@v8
        with:
          name: ovecc-linux-x86_64
          path: dist

      - name: Index the base and head commits
        id: snapshots
        run: |
          chmod +x dist/ovecc-linux-x86_64
          BIN="$PWD/dist/ovecc-linux-x86_64"
          BASE="${{ github.event.pull_request.base.sha }}"
          if [ -z "$BASE" ]; then
            BASE="$(git rev-parse --verify --quiet HEAD~1 || true)"
          fi
          HEAD_SHA="$(git rev-parse HEAD)"
          if [ -n "$BASE" ]; then
            git checkout --quiet "$BASE"
            "$BIN" index .
            git checkout --quiet "$HEAD_SHA"
          fi
          "$BIN" index .
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          BIN="$PWD/dist/ovecc-linux-x86_64"
          "$BIN" summary --format markdown | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Review the change (fail on new high findings)
        run: |
          BIN="$PWD/dist/ovecc-linux-x86_64"
          if [ -z "${{ steps.snapshots.outputs.base }}" ]; then
            echo "no base commit to review against; skipping" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          set +e
          "$BIN" review --fail-on high --format markdown > review.md
          code=$?
          set -e
          cat review.md
          cat review.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

  release:
    name: Publish rolling "latest" release
    needs: [lint, build-test, self-review]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Recreate the "latest" release with fresh binaries
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Drop the previous rolling release and its tag (ignore if absent),
          # then recreate it at this commit with the new assets. Marked
          # pre-release so /releases/latest keeps serving the tagged versions.
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --title "Rolling build (${GITHUB_SHA::7})" \
            --notes "Dev build from \`${GITHUB_SHA}\`: Linux and Windows x86_64, macOS arm64. For the supported build, use the newest versioned release." \
            --target "${GITHUB_SHA}" \
            --prerelease \
            dist/*

  release-version:
    name: Publish tagged release
    needs: [lint, build-test, self-review]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the tag against the workspace version
        run: |
          version="${GITHUB_REF_NAME#v}"
          grep -q "^version = \"${version}\"$" Cargo.toml || {
            echo "${GITHUB_REF_NAME} does not match the workspace version in Cargo.toml" >&2
            exit 1
          }

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Take this version's CHANGELOG section as the notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { in_section = 1; next }
            /^## \[/ { in_section = 0 }
            in_section' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Replace any existing release for this tag so re-cutting a version
          # (e.g. fixing the notes before anyone has consumed it) is idempotent.
          # Keep the tag itself — it is what triggered this run.
          gh release delete "$GITHUB_REF_NAME" --yes 2>/dev/null || true
          gh release create "$GITHUB_REF_NAME" \
            --title "ovecc ${GITHUB_REF_NAME#v}" \
            --verify-tag \
            --notes-file notes.md \
            --latest \
            dist/*

  publish-npm:
    name: Publish to npm
    needs: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # npm provenance attestation
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # The versions committed under npm/ are 0.0.0 placeholders: the tag is the
      # single source of truth, and release-version has already checked it against
      # Cargo.toml.
      - name: Stage the binaries and the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          install -Dm755 dist/ovecc-linux-x86_64       npm/cli-linux-x64/bin/ovecc
          install -Dm755 dist/ovecc-macos-aarch64      npm/cli-darwin-arm64/bin/ovecc
          install -Dm755 dist/ovecc-windows-x86_64.exe npm/cli-win32-x64/bin/ovecc.exe
          for p in cli-linux-x64 cli-darwin-arm64 cli-win32-x64 ovecc; do
            (cd "npm/$p" && npm pkg set version="$version")
          done
          (cd npm/ovecc && npm pkg set \
            "optionalDependencies.@ovecc/cli-linux-x64=$version" \
            "optionalDependencies.@ovecc/cli-darwin-arm64=$version" \
            "optionalDependencies.@ovecc/cli-win32-x64=$version")

      # Platform packages first: by the time the launcher is installable, its
      # optionalDependencies have to already resolve.
      #
      # Without ./, npm reads npm/cli-linux-x64 as a github owner/repo shorthand
      # and tries to clone it.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          for p in cli-linux-x64 cli-darwin-arm64 cli-win32-x64 ovecc; do
            npm publish --provenance --access public "./npm/$p"
          done

  publish-registry:
    name: Publish to the MCP registry
    needs: publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write # OIDC stands in for a registry token
    steps:
      - uses: actions/checkout@v7

      - name: Install mcp-publisher
        run: |
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # server.json carries the same 0.0.0 placeholders as the npm manifests, and
      # for the same reason: the tag is the version.
      - name: Stage the version
        run: |
          version="${GITHUB_REF_NAME#v}"
          jq --arg v "$version" '.version = $v | .packages[].version = $v' server.json > server.json.tmp
          mv server.json.tmp server.json

      # Ownership is proved by reading mcpName out of the package on
      # registry.npmjs.org, which lags the publish above by up to a minute.
      - name: Publish
        run: |
          ./mcp-publisher login github-oidc
          for attempt in 1 2 3; do
            ./mcp-publisher publish && exit 0
            echo "attempt ${attempt} failed, waiting for npm to serve the new version" >&2
            sleep 30
          done
          exit 1
