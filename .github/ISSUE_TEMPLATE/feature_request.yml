name: Feature request
description: A capability, rule, language, or integration you need
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do that ovecc can't do (or does badly) today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What should ovecc do? Sketch the command/output if you can.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds considered
