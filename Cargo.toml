[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "Apache-2.0"
description = "Deterministic, offline architecture intelligence: dependency graph, impact, dead code, duplication, security findings, and a CI gate"
repository = "https://github.com/Ovecc-labs/ovecc"
homepage = "https://ovecc.dev"
keywords = ["architecture", "static-analysis", "dependency-graph", "ci", "mcp"]
categories = ["development-tools", "command-line-utilities"]

[workspace.dependencies]
# Internal crates
ovecc-core = { path = "crates/ovecc-core" }
ovecc-db = { path = "crates/ovecc-db" }
ovecc-graph = { path = "crates/ovecc-graph" }
ovecc-indexer = { path = "crates/ovecc-indexer" }
ovecc-parser = { path = "crates/ovecc-parser" }
ovecc-git = { path = "crates/ovecc-git" }
ovecc-rules = { path = "crates/ovecc-rules" }
ovecc-dataflow = { path = "crates/ovecc-dataflow" }
ovecc-audit = { path = "crates/ovecc-audit" }
ovecc-ai = { path = "crates/ovecc-ai" }

# External dependencies
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "~1.10503.1", features = ["bundled"] }
gix = "0.84"
# Component path matching for architecture contracts. Already in the tree
# transitively through `ignore`, so this adds no new third-party code.
globset = "0.4"
ignore = "0.4"
petgraph = "0.8"
regex = "1.11"
rayon = "1.10"
semver = "1.0"
peak_alloc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
toml = "1.1"
ureq = { version = "2", features = ["json"] }
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-cpp = "0.23"
# JS/TS module resolution (tsconfig paths/baseUrl, package exports, extension
# aliasing). Pure-Rust, filesystem-only (no network).
oxc_resolver = "11"
# oxc parser/AST stack for the TS/JS semantic extractor (exports + complexity).
# Pure-Rust, offline, deterministic. Pinned to match fallow.
oxc_allocator = "0.126"
oxc_ast = "0.126"
oxc_ast_visit = "0.126"
oxc_parser = "0.126"
oxc_span = "0.126"
oxc_semantic = "0.126"
