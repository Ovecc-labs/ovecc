[package]
name = "ovecc"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
description = "CLI-first deterministic architecture intelligence engine."
license = "MIT"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "~1.10503.1", features = ["bundled"] }
ignore = "0.4"
petgraph = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"

[dev-dependencies]
tempfile = "3.10"
