[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# Internal crates
ovecc-core = { path = "crates/ovecc-core" }
ovecc-db = { path = "crates/ovecc-db" }
ovecc-graph = { path = "crates/ovecc-graph" }
ovecc-indexer = { path = "crates/ovecc-indexer" }
ovecc-parser = { path = "crates/ovecc-parser" }
ovecc-git = { path = "crates/ovecc-git" }
ovecc-rules = { path = "crates/ovecc-rules" }
ovecc-dataflow = { path = "crates/ovecc-dataflow" }
ovecc-audit = { path = "crates/ovecc-audit" }
ovecc-ai = { path = "crates/ovecc-ai" }

# External dependencies
anyhow = "1.0"
chrono = { version = "0.4", features = ["clock", "serde"] }
clap = { version = "4.5", features = ["derive"] }
duckdb = { version = "~1.10503.1", features = ["bundled"] }
gix = "0.84"
ignore = "0.4"
petgraph = "0.8"
rayon = "1.10"
semver = "1.0"
peak_alloc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
toml = "0.8"
tree-sitter = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.23"
tree-sitter-go = "0.23"
tree-sitter-rust = "0.23"
tree-sitter-cpp = "0.23"
